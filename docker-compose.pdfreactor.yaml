#ddev-generated
services:
  pdfreactor:
    container_name: ddev-${DDEV_SITENAME}-pdfreactor
    image: realobjects/pdfreactor
    # These labels ensure this service is discoverable by ddev.
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
    - ".:/mnt/ddev_config"
    - "ddev-global-cache:/mnt/ddev-global-cache"
    - "./pdfreactor:/ro/config"
    external_links:
    - "ddev-router:${DDEV_SITENAME}.${DDEV_TLD}"
    healthcheck:
      # The image ships no curl/wget/grep, so use pure bash with /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9423 && printf 'GET /service/rest/status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
